[delayed_gcode INIT_PRINTER]
initial_duration: 2
gcode:
    RESET_TO_START_STATE

[gcode_macro RESET_MULTIPLIERS]
gcode:
    RESPOND MSG="Resetting multipliers to 100%."
    M220 S100
    M221 S100

[gcode_macro RESET_SAVED_VARS]
gcode:
      RESPOND MSG="Setting saved vars to pre-print state."
      SAVE_VARIABLE VARIABLE=is_printing_gcode VALUE=False
      SAVE_VARIABLE VARIABLE=current_material VALUE='"None"'

[gcode_macro RESET_TO_START_STATE]
description: resets saved variables back to start state
gcode:
    RESPOND MSG="Resetting printer to pre-print state."
    RESET_MULTIPLIERS
    RESET_SAVED_VARS

[gcode_macro MAYBE_LOAD_SKEW_CORRECTION]
gcode:
    {% set vars = printer["gcode_macro _PRINTER_VARS"] %}
    {% set profile = vars.skew_profile|default("default") %}
    RESPOND MSG="Attempting to load skew correction profile '{profile}'"
    {% if "skew_correction" in printer.configfile.settings %}
      SKEW_PROFILE LOAD={profile}
      RESPOND MSG="Skew correction profile '{profile}' loaded"
    {% endif %}

[gcode_macro DISABLE_XY]
gcode:
    RESPOND MSG="Disabling XY motors"
    {% if "stepper_x" in printer.configfile.settings %} SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=0 {% endif %}
    {% if "stepper_y" in printer.configfile.settings %} SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=0 {% endif %}


[gcode_macro DISABLE_ALL_MOTORS]
gcode:
    RESPOND MSG="Disabling all motors"
    M84  # All Motors off

[gcode_macro TURN_OFF_HEATERS]
rename_existing: TURN_OFF_HEATERS_BASE
gcode:
      RESPOND MSG="Turning off all heaters"
      TURN_OFF_HEATERS_BASE


[gcode_macro _FALLBACK_PURGE]
variable_length: 25
variable_speed: 10
gcode:
  {% set purge_length = params.LENGTH|default(length)|float %}
  {% set travel_speed = (params.SPEED|default(speed)|float * 60)|int %}
  {% set x0 = printer.toolhead.axis_minimum.x|float + 2 %}
  {% set y0 = printer.toolhead.axis_minimum.y|float + 2 %}
  G90
  G1 X{x0} Y{y0} F{travel_speed}
  G1 E{purge_length/5.0} F{(5*60)}
  G1 X{x0 + purge_length} F{travel_speed}
  G92 E0

[gcode_macro CALIBRATE_BED_MESH]
description: Scan and validate the bed mesh
gcode:
  {% set vars = printer["gcode_macro _PRINTER_VARS"] %}
  {% set max_deviation = params.MAX_DEVIATION|default(vars.max_mesh_deviation|default(0.200))|float %}
  RESPOND MSG="Starting bed mesh calibration..."
  BED_MESH_CALIBRATE ADAPTIVE=1
  BED_MESH_CHECK MAX_DEVIATION={max_deviation}
  RESPOND MSG="Bed mesh validated (max deviation: {max_deviation}mm)"

[gcode_macro _SET_MPC_MATERIAL]
description: Set MPC filament properties (density from the slicer, heat capacity by material type)
gcode:
  # FILAMENT_DENSITY (g/cm^3) is the slicer profile's filament_density, validated by
  # PRINT_START_PREFLIGHT; the slicer profile is its single owner. Without it (older
  # G-code, manual calls) the [extruder] config default applies. OrcaSlicer has no heat
  # capacity setting, so heat capacity (J/g/K) stays keyed by MATERIAL here.
  {% set material = params.MATERIAL|default("ASA")|upper %}
  # Mean specific heat (J/g/K) from ambient to print temperature, because MPC multiplies it
  # by (block - ambient), not a room-temperature cp. Sources: docs/mpc-heat-capacity.md.
  {% set capacity_map = {
    "PLA": 1.95, "ABS": 1.80, "ASA": 1.80,
    "ABS-MD-GF15": 1.65,
    "PETG": 1.75, "PET-CF": 1.70,
    "PC": 1.60, "PC-CF": 1.50,
    "PA": 2.30, "NYLON": 2.30, "PA-CF": 2.00, "PA-GF": 2.00,
    "TPU": 1.90,
  } %}
  {% if params.FILAMENT_DENSITY is defined %}
    {% set density = params.FILAMENT_DENSITY|float %}
    {% set density_source = "slicer" %}
  {% else %}
    {% set density = printer.configfile.settings.extruder.filament_density|float %}
    {% set density_source = "extruder config default" %}
  {% endif %}
  {% set capacity = capacity_map[material] if material in capacity_map else 1.80 %}
  MPC_SET HEATER=extruder FILAMENT_DENSITY={density} FILAMENT_HEAT_CAPACITY={capacity}
  RESPOND MSG="MPC material: {material} (density={density} from {density_source}, heat_capacity={capacity})"

[idle_timeout]
gcode:
  {% set svv = printer.save_variables.variables %}
  {% set is_printing_gcode = svv.is_printing_gcode %}
  {% if is_printing_gcode %}
    {action_respond_info("Idle Timeout Reached: Cancelling Print")}
    CANCEL_PRINT
  {% else %}
    {action_respond_info("Idle Timeout Reached: Steppers and Heaters powered down")}
    TURN_OFF_HEATERS ; Builtin kalico macro
    DISABLE_ALL_MOTORS
  {% endif %}

[gcode_macro _CLEAR_PRINT_SKEW]
gcode:
  {% if "skew_correction" in printer.configfile.settings %}
    SET_SKEW CLEAR=1
  {% endif %}
