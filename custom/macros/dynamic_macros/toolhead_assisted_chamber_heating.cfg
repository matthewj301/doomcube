[gcode_macro TA_CHAMBER_HEAT]
description: Start interruptible chamber warmup; shares PREHEAT state and validation
gcode:
  {% set vars = printer['gcode_macro _PRINTER_VARS'] %}
  PREHEAT {rawparams} BED_TEMP={params.BED_TEMP|default(vars.chamber_heat_default_bed_temp)} TARGET_CHAMBER_TEMP={params.TARGET_CHAMBER_TEMP|default(vars.default_chamber_target)}

[gcode_macro TA_CHAMBER_STATE]
variable_active: False
variable_job: {}
gcode:
  RESPOND MSG="Chamber heating active: {active}"

[delayed_gcode _TA_CHAMBER_TIMER]
gcode:
  _TA_CHAMBER_TICK

[gcode_macro _TA_CHAMBER_TICK]
gcode: !!include ../python/chamber_tick.py

[gcode_macro TA_CHAMBER_STOP]
description: Stop warmup; cancel pending print startup and switch heaters off
gcode:
  {% set pending = printer['gcode_macro _PRINT_START_STATE'].active %}
  _TA_CHAMBER_RESET
  TURN_OFF_HEATERS_BASE
  M107
  {% if pending %}
    CANCEL_PRINT
  {% endif %}
  RESPOND MSG="Preheat stopped"

[gcode_macro _TA_CHAMBER_RESET]
description: Clear scheduled work without movement or changing thermal policy
gcode:
  UPDATE_DELAYED_GCODE ID=_TA_CHAMBER_TIMER DURATION=0
  SET_GCODE_VARIABLE MACRO=TA_CHAMBER_STATE VARIABLE=active VALUE=False
  SET_GCODE_VARIABLE MACRO=TA_CHAMBER_STATE VARIABLE=job VALUE={{}}
  SET_GCODE_VARIABLE MACRO=_PRINT_START_STATE VARIABLE=active VALUE=False
  SET_GCODE_VARIABLE MACRO=_PRINT_START_STATE VARIABLE=sd_paused VALUE=False
