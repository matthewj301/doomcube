[gcode_macro _FLEET_ALERT_STATE]
variable_observed: {}
variable_failure: ''
variable_startup_failure_file: None
gcode:

[gcode_macro _FLEET_NOTIFY]
description: Emit an event locally and optionally forward it to a configured Moonraker notifier
gcode: !!include python/notify.py

[delayed_gcode _FLEET_ALERT_TIMER]
initial_duration: 5
gcode:
  _FLEET_ALERT_WATCH

[gcode_macro _FLEET_ALERT_WATCH]
gcode: !!include python/alert_watch.py
