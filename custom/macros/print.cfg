# Startup yields during preheat; virtual SD is held until continuation succeeds.
[gcode_macro PRINT_START]
description: Validate, prepare, and start interruptible preheat
gcode: !!include python/print_start.py

[gcode_macro _PRINT_START_STATE]
variable_active: False
variable_sd_paused: False
variable_filename: ''
variable_params: {}
gcode:

# =====================
# PRINT_START (Beacon-aware, KAMP-aware, no hard-coded units)
# =====================
[gcode_macro _PRINT_START_BEGIN]
description: Start the print
gcode:
  {% set vars = printer["gcode_macro _PRINTER_VARS"] %}
  {% set bed_temp = params.BED_TEMP|default(0)|float %}
  {% set hotend_temp = params.HOTEND_TEMP|default(0)|float %}
  {% set chamber_target_temp = params.TARGET_CHAMBER_TEMP|default(0)|float %}
  {% set initial_tool = params.TOOL|default("0")|int %}
  {% set mat = params.MATERIAL | default(vars.default_material)|upper %}

  UPDATE_DELAYED_GCODE ID=FILTER_DELAYED_STOP DURATION=0

  # Fire heaters before homing so bed warm-up overlaps MAYBE_HOME. Beacon path warms the
  # hotend to the contact-cal temp (not final print temp); PREHEAT re-issues these idempotently.
  {% if "beacon" in printer.configfile.settings %}
    {% set warmup_hotend = printer["gcode_macro BEACON_VARS"].beacon_contact_calibration_temp|int %}
  {% else %}
    {% set warmup_hotend = hotend_temp|int %}
  {% endif %}
  M140 S{bed_temp}
  M104 S{warmup_hotend}

  {% set travel_accel = vars.travel_accel|float %}
  {% set saved_accel = printer.toolhead.max_accel %}

  # Get back to clean state
  _CLEAR_PRINT_SKEW
  CLEAR_PAUSE
  RESET_MULTIPLIERS
  {% if "bed_mesh" in printer.configfile.settings %}
    BED_MESH_CLEAR
  {% endif %}
  SET_GCODE_OFFSET Z=0
  {% if "_BEACON_SET_NOZZLE_TEMP_OFFSET" in printer.gcode.commands %}
    _BEACON_SET_NOZZLE_TEMP_OFFSET RESET=True
  {% endif %}
  ## Absolute positioning
  G90   
  
  # Lights, homing
  {% if "CASE_LIGHTS_ON" in printer.gcode.commands %} CASE_LIGHTS_ON {% endif %}
  {% if "neopixel nozzle_led" in printer.configfile.settings %}
    SET_LED LED="nozzle_led" RED=1 GREEN=0.22 BLUE=0 WHITE=0 SYNC=0 TRANSMIT=1
  {% endif %}
  MAYBE_HOME

  # Save material for use in pre-heat logic
  SAVE_VARIABLE VARIABLE=current_material VALUE='"{mat}"'

  # Set MPC filament properties if MPC is active
  {% if printer.configfile.settings.extruder.control|default("") == "mpc" %}
    _SET_MPC_MATERIAL MATERIAL="{mat}"
  {% endif %}


[gcode_macro _PRINT_START_AFTER_PREHEAT]
gcode:
  {% set params = printer["gcode_macro _PRINT_START_STATE"].params %}
  {% set vars = printer["gcode_macro _PRINTER_VARS"] %}
  {% set hotend_temp = params.HOTEND_TEMP|float %}
  {% set initial_tool = params.TOOL|default(0)|int %}
  {% set saved_accel = printer.toolhead.max_accel %}
  {% set travel_accel = vars.travel_accel|float %}
  {% if "beacon" in printer.configfile.settings %}
    {% if "SET_SLOW_CHAMBER_FAN_SPEED" in printer.gcode.commands %}
      SET_SLOW_CHAMBER_FAN_SPEED
    {% endif %}
    # Home Z with Beacon contact - calibrate z-offset and geneate new model (Should be done hot, hense after PREHEAT)

  #  Calibrate z offset only after tilt/mesh
    G28 Z METHOD=CONTACT CALIBRATE=1                                                         
  {% else %}
    # Home Z, no need to wait for special beacon stuff.  
    G28 Z
    {% if "SET_SLOW_CHAMBER_FAN_SPEED" in printer.gcode.commands %}
      SET_SLOW_CHAMBER_FAN_SPEED
    {% endif %}
    # Clean nozzle if macro is defined. Too many ways to clean a nozzle so user has to take care of setting up the CLEAN_NOZZLE macro correctly for their setup
    {% if printer['gcode'].commands['CLEAN_NOZZLE'] %}
      CLEAN_NOZZLE
    {% endif %}
    
  {% endif %}

  # Level everything out
  {% if "quad_gantry_level" in printer.configfile.settings %}
    QUAD_GANTRY_LEVEL
  {% elif "z_tilt" in printer.configfile.settings or "z_tilt_ng" in printer.configfile.settings %}
    Z_TILT_ADJUST
  {% else %}
    RESPOND MSG="No gantry leveling module detected - skipping."
  {% endif %}
  
  {% if "bed_mesh" in printer.configfile.settings %}
    CALIBRATE_BED_MESH
  {% endif %}

  {% if "beacon" in printer.configfile.settings %}
    # Clean nozzle again if macro is defined. Too many ways to clean a nozzle so user has to take care of setting up the CLEAN_NOZZLE macro correctly for their setup
    {% if printer['gcode'].commands['CLEAN_NOZZLE'] %}
      CLEAN_NOZZLE
    {% endif %}
    # Home Z with Beacon contact - just calibrate true z-offset after leveling everything
    G28 Z METHOD=CONTACT CALIBRATE=0
    # Start ramping hotend to print temp now that all probing is done
    M104 S{hotend_temp}
  {% endif %}

  # Limit accel for travel moves (parking, toolchange, purge)
  SET_VELOCITY_LIMIT ACCEL={travel_accel}

  # park toolhead BEFORE potential toolchange
  {% if printer.configfile.config["gcode_macro SMART_PARK"] is defined %}
      SMART_PARK
  {% else %}
      PICK_PARK_LOCATION
  {% endif %}
  
  # Displays info
  SET_DISPLAY_TEXT MSG="Heating hotend to {hotend_temp}c"
  # Wait for final print temp
  M109 S{hotend_temp}

  {% if "T0" in printer.gcode.commands and (printer.mmu is not defined or printer.mmu.enabled) %}
    SET_DISPLAY_TEXT MSG="Loading tool T{initial_tool}"
    T{initial_tool}
  {% else %}
    RESPOND MSG="No enabled tool system — using manually loaded filament; skipping tool load"
  {% endif %}

  _PRINT_START_CHECK_READY

  # park toolhead AFTER potential toolchange
  {% if printer.configfile.config["gcode_macro SMART_PARK"] is defined %}
      # KAMP parking
      SMART_PARK
  {% else %}
      PICK_PARK_LOCATION
  {% endif %}

  # Apply thermal expansion compensation if present
  {% if printer.configfile.config["gcode_macro _BEACON_SET_NOZZLE_TEMP_OFFSET"] is defined %}
    RESPOND MSG="Setting Beacon thermal expansion compensation"
    _BEACON_SET_NOZZLE_TEMP_OFFSET
  {% endif %}


  RESPOND MSG="Purging..."
  LINE_PURGE

  # Restore full print accel
  SET_VELOCITY_LIMIT ACCEL={saved_accel}

  # Load skew correction if configured
  MAYBE_LOAD_SKEW_CORRECTION
  
  RESPOND MSG="Starting Print..."
  
  SAVE_VARIABLE VARIABLE=is_printing_gcode VALUE=True


# =====================
# PRINT_END (unit-safe; avoids duplicate M84)
# =====================
[gcode_macro PRINT_END]
description: Consistent end-of-print routine. reason codes: 0 = cancelled, 1 = completed
gcode:
  {% set reason = params.REASON|default("complete")|lower %}
  {% if reason not in ["complete", "cancel"] %}
    { action_raise_error("PRINT_END: REASON must be 'complete' or 'cancel' (got '%s')." % reason) }
  {% endif %}
  {% set reason_code = 1 if reason == "complete" else 0 %}
  RESPOND MSG="Passed reason: {reason}, code: {reason_code}"

  {% set vars = printer["gcode_macro _PRINTER_VARS"] %}
  {% set retract_speed = (vars.retract_speed|float * 60)|int %}
  {% set retract_length = vars.end_retract_length|float %}

  _CLEAR_PRINT_SKEW
  PICK_PARK_LOCATION

  M400

  TURN_PART_COOLING_FAN_OFF

  G92 E0
  {% if printer.extruder.can_extrude %}
    G91
    G1 E-{retract_length} F{retract_speed}
    G90
  {% endif %} 

  {% if printer.configfile.config["gcode_macro _BEACON_REMOVE_NOZZLE_TEMP_OFFSET"] is defined %}
    _BEACON_REMOVE_NOZZLE_TEMP_OFFSET
  {% endif %}

  # Clear mesh
  {% if "bed_mesh" in printer.configfile.settings %}
    BED_MESH_CLEAR
  {% endif %}

  # complete → QUICK=0 (controlled stepped cooldown); cancel → QUICK=1 (fast)
  COOLDOWN_SEQUENCE QUICK={0 if reason == "complete" else 1}
  DISABLE_ALL_MOTORS
  {% if "CASE_LIGHTS_OFF" in printer.gcode.commands %} CASE_LIGHTS_OFF {% endif %}
  {% if "neopixel nozzle_led" in printer.configfile.settings %}
    SET_LED LED="nozzle_led" RED=0 GREEN=0 BLUE=0 WHITE=0 SYNC=0 TRANSMIT=1
  {% endif %}

  
  RESET_TO_START_STATE

[gcode_macro PAUSE]
rename_existing: PAUSE_BASE
gcode:
  {% if printer['gcode_macro _PRINT_START_STATE'].active %}
    {action_raise_error("Startup is heating; use TA_CHAMBER_STOP or CANCEL_PRINT to stop")}
  {% endif %}
  {% if printer.pause_resume.is_paused %}
    {action_respond_info("Already paused...")}
  {% else %}
    # Record hotend temp variable for reference in resume macro
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=printing_target_temp VALUE={printer['extruder'].target}

    {% if printer.mmu is defined and printer.mmu.enabled %}
      # Happy Hare owns parking + position save/restore (it also wraps RESUME).
      # Do NOT add our own park/SAVE_GCODE_STATE here or it double-parks and
      # corrupts the saved position. _MMU_PARK is idempotent: it's a no-op when
      # an MMU-driven pause (M600/runout/error) already parked the toolhead.
      _MMU_SAVE_POSITION
      PAUSE_BASE
      _MMU_PARK OPERATION="pause"
    {% else %}
      {% set vars   = printer["gcode_macro _PRINTER_VARS"] %}
      {% set retract_speed = (vars.retract_speed|float*60)|int %}
      {% set retract_length = vars.end_retract_length|float %}

      # The firmware owns the sole print-position snapshot, captured BEFORE parking.
      PAUSE_BASE
      SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=retracted_length VALUE={retract_length if printer.extruder.can_extrude else 0}

      # Retract to reduce oozing
      G92 E0
      {% if printer.extruder.can_extrude %}
        G91
        G1 E-{retract_length} F{retract_speed}
        G90
      {% endif %}

      PICK_PARK_LOCATION

      # Cap how long the hotend can sit hot while paused (idle_timeout fires CANCEL_PRINT)
      SET_IDLE_TIMEOUT TIMEOUT={vars.pause_idle_timeout|int}
      # Save parked position in case toolhead needs to move during pause
      SAVE_GCODE_STATE NAME=PAUSEPARK
    {% endif %}
  {% endif %}

[gcode_macro RESUME]
rename_existing: RESUME_BASE
variable_printing_target_temp: 0
variable_retracted_length: 0
gcode:
  {% set vars = printer["gcode_macro _PRINTER_VARS"] %}
  {% if printer['gcode_macro _PRINT_START_STATE'].active %}
    {action_raise_error("Startup is heating; use TA_CHAMBER_STOP or CANCEL_PRINT to stop")}
  {% endif %}
  {% if not printer.pause_resume.is_paused %}
    {action_raise_error("RESUME: printer is not paused")}
  {% endif %}

  {% if printer.mmu is defined and printer.mmu.enabled %}
    # Happy Hare wraps RESUME: it runs this macro (as __RESUME) and then restores
    # the toolhead position itself (single, fast un-park at park_travel_speed).
    # We must NOT restore position here or it fights HH and resumes off-height.
    # Reheat + reapply offset while still parked, then hand back to HH.
    {% if printing_target_temp > 0 %}
      RESPOND MSG="Resuming: heating hotend to {printing_target_temp}C"
      M109 S{printing_target_temp}
    {% endif %}
    {% if printer.configfile.config["gcode_macro _BEACON_SET_NOZZLE_TEMP_OFFSET"] is defined %}
      _BEACON_SET_NOZZLE_TEMP_OFFSET
    {% endif %}
    RESUME_BASE
  {% else %}
    # Run the readiness check in a later macro, after M109 has executed.
    {% if printing_target_temp > 0 %}
      M109 S{printing_target_temp}
    {% endif %}
    _RESUME_NON_MMU
  {% endif %}

[gcode_macro _RESUME_NON_MMU]
description: Recheck extrusion after reheat, then let firmware restore the print position once
gcode:
  {% set vars = printer["gcode_macro _PRINTER_VARS"] %}
  {% set resume = printer["gcode_macro RESUME"] %}
  {% if printer['gcode_macro _PRINT_START_STATE'].active %}
    {action_raise_error("Startup is heating; use TA_CHAMBER_STOP or CANCEL_PRINT to stop")}
  {% endif %}
  {% if not printer.pause_resume.is_paused %}
    {action_raise_error("RESUME: printer is not paused")}
  {% endif %}
  {% if resume.retracted_length|float > 0 and not printer.extruder.can_extrude %}
    {action_raise_error("RESUME: nozzle is still too cold to unretract")}
  {% endif %}
  {% set saved_accel = printer.toolhead.max_accel %}
  SET_VELOCITY_LIMIT ACCEL={vars.travel_accel|float}
  RESTORE_GCODE_STATE NAME=PAUSEPARK MOVE=1 MOVE_SPEED={vars.travel_speed|float / 2}
  {% if printer.configfile.config["gcode_macro _BEACON_SET_NOZZLE_TEMP_OFFSET"] is defined %}
    _BEACON_SET_NOZZLE_TEMP_OFFSET
  {% endif %}
  {% if resume.retracted_length|float > 0 %}
    SAVE_GCODE_STATE NAME=_RESUME_EXTRUSION
    M83
    G1 E{resume.retracted_length|float} F{vars.retract_speed|float * 60}
    RESTORE_GCODE_STATE NAME=_RESUME_EXTRUSION
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=retracted_length VALUE=0
  {% endif %}
  SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout|int}
  RESUME_BASE VELOCITY={vars.travel_speed|float / 2}
  SET_VELOCITY_LIMIT ACCEL={saved_accel}

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
description: Cancel print
gcode:
    # Mandatory cancellation is independent of parking, homing and optional hardware.
    TURN_OFF_HEATERS_BASE
    BASE_CANCEL_PRINT
    _TA_CHAMBER_RESET
    M107
    M84
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout|int}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=printing_target_temp VALUE=0
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=retracted_length VALUE=0
    _CLEAR_PRINT_SKEW
    RESET_TO_START_STATE
    {% if "bed_mesh" in printer.configfile.settings %}
        BED_MESH_CLEAR
    {% endif %}
    {% if printer.configfile.config["gcode_macro _BEACON_REMOVE_NOZZLE_TEMP_OFFSET"] is defined %}
        _BEACON_REMOVE_NOZZLE_TEMP_OFFSET
    {% endif %}
    {% if printer.mmu is defined and printer.mmu.enabled %}
        MMU_TTG_MAP RESET=1 QUIET=1
    {% endif %}
    COOLDOWN_SEQUENCE QUICK=1
    {% if "CASE_LIGHTS_OFF" in printer.gcode.commands %} CASE_LIGHTS_OFF {% endif %}
    RESPOND MSG="Print cancelled; heaters and motors off."

[gcode_macro M600]
description: Filament change (pause + unload)
gcode:
	{% set vars = printer["gcode_macro _PRINTER_VARS"] %}
	{% set unload_len = vars.m600_unload_length|float %}
	{% set unload_feedrate = (vars.m600_unload_speed|float * 60)|int %}
	PAUSE
	{% if printer.mmu is defined and printer.mmu.enabled %}
	  MMU_PAUSE
	{% elif printer.configfile.config["gcode_macro UNLOAD_FILAMENT"] is defined %}
	  UNLOAD_FILAMENT
	{% elif printer.extruder.can_extrude %}
	  G91
	  G1 E-{unload_len} F{unload_feedrate}
	  G90
	{% else %}
	  RESPOND MSG="No filament system detected — manual change required"
	{% endif %}