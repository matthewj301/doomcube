[gcode_macro PRINT_START_PREFLIGHT]
description: Validate startup inputs and dependencies without heating or moving
gcode:
  {% set cfg = printer.configfile.settings %}
  {% set commands = printer.gcode.commands %}
  {% set vars = printer["gcode_macro _PRINTER_VARS"] %}
  {% set hotend = params.HOTEND_TEMP|default('')|float(none) %}
  {% set bed = params.BED_TEMP|default(0)|float(none) %}
  {% set chamber = params.TARGET_CHAMBER_TEMP|default(0)|float(none) %}
  {% if hotend is none or not (cfg.extruder.min_extrude_temp|default(170)|float <= hotend <= cfg.extruder.max_temp|float) %}
    {action_raise_error("PRINT_START: HOTEND_TEMP must be between the configured extrusion minimum and heater maximum")}
  {% endif %}
  {% if bed is none or not (bed == 0 or cfg.heater_bed.min_temp|float <= bed <= cfg.heater_bed.max_temp|float) %}
    {action_raise_error("PRINT_START: BED_TEMP must be zero or within configured heater limits")}
  {% endif %}
  {% set sensor = 'temperature_sensor ' ~ vars.chamber_sensor_name %}
  {% if chamber is none or not (chamber >= 0) %}
    {action_raise_error("PRINT_START: invalid TARGET_CHAMBER_TEMP")}
  {% elif chamber > 0 %}
    {% if sensor not in printer or sensor not in cfg %}
      {action_raise_error("PRINT_START: chamber target requested without a configured chamber sensor")}
    {% elif not (chamber <= cfg[sensor].max_temp|float) %}
      {action_raise_error("PRINT_START: chamber target exceeds sensor limit")}
    {% endif %}
  {% endif %}
  {% set tool = params.TOOL|default('0')|float(none) %}
  {% if tool is none or not (0 <= tool <= 255) or tool != tool|int %}
    {action_raise_error("PRINT_START: TOOL must be a nonnegative integer (0-255)")}
  {% endif %}
  {% set mmu_enabled = printer.mmu is defined and printer.mmu.enabled %}
  {% set tool_system = mmu_enabled or (printer.mmu is not defined and 'T0' in commands) %}
  {% if tool_system and ('T' ~ tool|int|string) not in commands %}
    {action_raise_error("PRINT_START: requested tool command is unavailable")}
  {% elif not tool_system and tool != 0 %}
    {action_raise_error("PRINT_START: nonzero TOOL requested without an enabled tool system")}
  {% endif %}
  {% set material = params.MATERIAL|default(vars.default_material)|upper %}
  {% if not material %}
    {action_raise_error("PRINT_START: MATERIAL must not be empty")}
  {% endif %}
  {% for char in material %}
    {% if char not in 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-_. ' %}
      {action_raise_error("PRINT_START: MATERIAL contains unsupported characters")}
    {% endif %}
  {% endfor %}
  {% for command in ['LINE_PURGE', 'MAYBE_HOME', 'PREHEAT', 'PICK_PARK_LOCATION'] %}
    {% if command not in commands %}
      {action_raise_error("PRINT_START: required command " ~ command ~ " is unavailable")}
    {% endif %}
  {% endfor %}
  {% if 'beacon' in cfg %}
    {% if 'gcode_macro BEACON_VARS' not in printer %}
      {action_raise_error("PRINT_START: Beacon contact temperature configuration is missing")}
    {% endif %}
    {% set contact = printer['gcode_macro BEACON_VARS'].beacon_contact_calibration_temp|float %}
    {% if not (cfg.extruder.min_temp|float <= contact <= cfg.extruder.max_temp|float) %}
      {action_raise_error("PRINT_START: invalid Beacon contact temperature")}
    {% endif %}
  {% endif %}
  {% for fan in [vars.filter_fan, vars.bed_fan, vars.chamber_fan] %}
    {% if fan and ('fan_generic ' ~ fan) not in cfg %}
      {action_raise_error("PRINT_START: configured fan '" ~ fan ~ "' is unavailable")}
    {% endif %}
  {% endfor %}
  RESPOND MSG="Startup preflight passed"

[gcode_macro _PRINT_START_CHECK_READY]
description: Re-read pause/readiness after tool loading, before purge or SD release
gcode:
  {% if printer.pause_resume.is_paused %}
    {action_raise_error("PRINT_START: tool loading paused; aborting startup before purge")}
  {% endif %}
  {% if not printer.extruder.can_extrude %}
    {action_raise_error("PRINT_START: nozzle is not ready to purge")}
  {% endif %}
